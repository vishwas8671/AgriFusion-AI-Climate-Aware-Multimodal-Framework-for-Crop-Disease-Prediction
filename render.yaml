services:
  # ========================================================
  # 1. Python FastAPI ML Microservice (PyTorch + Grad-CAM)
  # ========================================================
  - type: web
    name: agrifusion-ml
    runtime: python
    region: oregon
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: MODEL_BACKBONE
        value: efficientnet_b0
      - key: DEVICE
        value: cpu

  # ========================================================
  # 2. Node.js Express Application API Gateway
  # ========================================================
  - type: web
    name: agrifusion-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --production
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # Set to MongoDB Atlas connection string in Render Dashboard
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: agrifusion-ml
          property: host
